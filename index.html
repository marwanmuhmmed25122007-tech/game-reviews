<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Reviews</title>
  <meta name="description"
    content="A minimalist, monochrome personal gaming portfolio featuring top-tier games, category filtering, and modal game reviews." />

  <link rel="stylesheet" href="style.css" />  
  <!-- Google Fonts: Nunito & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap"
    rel="stylesheet" />
</head>

<body>

  <!-- Main Content Container -->
  <div class="container">

    <!-- Top Navbar -->
    <header class="navbar" role="banner">
      <a href="#" class="brand-link" id="brandReset" title="Reset Filters">
        <div class="brand-icon">
          <!-- Gamepad SVG -->
          <svg viewBox="0 0 24 24">
            <path
              d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" />
          </svg>
        </div>
        <h1 class="brand-title">GAME REVIEWS</h1>
      </a>

      <!-- Category Filter Links -->
      <nav role="navigation" aria-label="Category Filters">
        <ul class="nav-filters" id="categoryFilters">
          <li>
            <button class="filter-btn active" data-category="ALL" id="filter-all">
              ALL <span class="filter-count" id="count-all">10</span>
            </button>
          </li>
          <li>
            <button class="filter-btn" data-category="ACTION" id="filter-action">
              ACTION <span class="filter-count" id="count-action">0</span>
            </button>
          </li>
          <li>
            <button class="filter-btn" data-category="ADVENTURE" id="filter-adventure">
              ADVENTURE <span class="filter-count" id="count-adventure">0</span>
            </button>
          </li>
          <li>
            <button class="filter-btn" data-category="SPORTS" id="filter-sports">
              SPORTS <span class="filter-count" id="count-sports">0</span>
            </button>
          </li>
          <li>
            <button class="filter-btn" data-category="SANDBOX" id="filter-sandbox">
              SANDBOX <span class="filter-count" id="count-sandbox">0</span>
            </button>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Toolbar: Status -->
    <div class="toolbar">
      <div class="catalog-count-label">
        Showing <strong id="visibleCountText">10</strong> games in collection
      </div>
    </div>

    <!-- Games Responsive CSS Grid -->
    <main>
      <div class="games-grid" id="gamesGrid" aria-live="polite">
        <!-- Dynamically rendered via JS -->
      </div>
    </main>

  </div>

  <!-- Details Overlay Modal -->
  <div class="modal-backdrop" id="gameModal" role="dialog" aria-modal="true" aria-labelledby="modalGameTitle">
    <div class="modal-box">

      <!-- Top Modal Header -->
      <div class="modal-header">
        <h2 class="modal-headline">Details Game</h2>
        <button class="modal-close-btn" id="closeModalBtn" aria-label="Close details dialog">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>

      <!-- Two-Column Modal Body -->
      <div class="modal-body">

        <!-- Left: Large Image & Quick Specs -->
        <div class="modal-left-col">
          <div class="modal-cover-frame">
            <img id="modalCoverImg" class="modal-cover-image" src="" alt="Game Artwork" />
          </div>

          <div class="modal-specs-box">
            <div class="spec-item">
              <span class="spec-label">Rating</span>
              <span class="spec-val" id="modalRating">9.5 / 10</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Release Year</span>
              <span class="spec-val" id="modalYear">2022</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Developer</span>
              <span class="spec-val" id="modalDeveloper">Studio</span>
            </div>
            <div class="spec-item">
              <span class="spec-label">Playtime</span>
              <span class="spec-val" id="modalPlaytime">45+ Hours</span>
            </div>
          </div>
        </div>

        <!-- Right: Metadata & Detailed Paragraphs -->
        <div class="modal-right-col">
          <h3 class="modal-title-text" id="modalGameTitle">Title: Game Title</h3>

          <div class="modal-meta-list">
            <div class="meta-item-row">
              <span class="meta-title-label">Category:</span>
              <span class="mono-pill-badge" id="modalCategoryBadge">ACTION</span>
            </div>

            <div class="meta-item-row">
              <span class="meta-title-label">Platform:</span>
              <span class="mono-pill-badge" id="modalPlatformBadge">PC (Windows)</span>
            </div>

            <div class="meta-item-row">
              <span class="meta-title-label">Status:</span>
              <span class="mono-pill-badge" id="modalStatusBadge">Played</span>
            </div>
          </div>

          <!-- Description Paragraphs -->
          <div class="modal-description-box">
            <p id="modalDescP1"></p>
            <p id="modalDescP2"></p>
          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div class="mono-toast" id="monoToast" role="status" aria-live="polite">
    <span id="toastMessage">Action completed</span>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    <p>© 2026 Personal Gaming Portfolio</p>
  </footer>

  <script src="script.js"></script>

</body>

</html>
